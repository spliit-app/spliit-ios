name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, to catch the API changing shape under us.
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the decoders, the storage migration and the money maths, on the host.
  # No simulator, no server — this should stay under a minute.
  unit:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Runner images move Xcode around and rename it between releases, so pick the newest
      # one that is actually installed rather than hardcoding a path.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        working-directory: Packages/SpliitKit
        run: swift test

  build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # `make build` passes CODE_SIGNING_ALLOWED=NO, so CI needs no signing credentials.
      - name: Build for simulator
        run: make build

  # The real thing: the app driving a real Spliit instance in the simulator.
  #
  # GitHub's macOS runners have no Docker daemon, so Colima provides one. It is the slow part
  # of this workflow; if it becomes the bottleneck, the alternative is running Postgres from
  # Homebrew and the web app from source, which trades container startup for a Next.js build.
  e2e:
    name: End-to-end tests
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen colima docker docker-compose

      - name: Start Docker
        run: colima start --cpu 3 --memory 6 --disk 20

      - name: Start Spliit
        run: make e2e-up

      - name: Verify the API client against the real server
        run: make test-live

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project Spliit.xcodeproj -scheme Spliit \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/e2e.xcresult

      - name: Stop Spliit
        if: always()
        run: make e2e-down

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: build/e2e.xcresult
          retention-days: 7

  # Catches what recorded fixtures cannot: the Spliit API changing shape.
  #
  # This runs against a *fresh* pull of the published image rather than against spliit.app,
  # for two reasons — the live suite writes data, which has no business landing in production,
  # and testing the newest image catches a breaking change before it is deployed rather than
  # after.
  upstream-drift:
    name: Upstream API drift
    if: github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install Docker
        run: brew install colima docker docker-compose

      - name: Start Docker
        run: colima start --cpu 3 --memory 6 --disk 20

      - name: Pull the latest Spliit and start it
        run: |
          docker compose -f e2e/compose.yaml pull
          make e2e-up

      - name: Round-trip every procedure the app uses
        run: make test-live

      - name: Re-record fixtures and report any drift
        run: |
          make fixtures
          if ! git diff --quiet -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures; then
            echo "::warning::Recorded API fixtures differ from the current server."
            git diff --stat -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures
          fi

      - name: Stop Spliit
        if: always()
        run: make e2e-down
