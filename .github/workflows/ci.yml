name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly, to catch the API changing shape under us.
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the decoders, the storage migration and the money maths, on the host.
  # No simulator, no server — this should stay under a minute.
  unit:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Runner images move Xcode around and rename it between releases, so pick the newest
      # one that is actually installed rather than hardcoding a path.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        working-directory: Packages/SpliitKit
        run: swift test

  build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # `make build` passes CODE_SIGNING_ALLOWED=NO, so CI needs no signing credentials.
      - name: Build for simulator
        run: make build

  # The real thing: the app driving a real Spliit instance in the simulator.
  #
  # Only on pull requests that are ready for review. It takes 10-20 minutes, which is too slow
  # to pay on every push to a branch still being worked on. Because every change reaches main
  # through a PR, main is still covered — by the run that gated the merge.
  e2e:
    name: End-to-end tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # GitHub's macOS runners are themselves VMs and cannot nest virtualization, so Colima
      # has no way to start a Docker daemon. The server therefore runs natively: Postgres from
      # Homebrew, and Spliit in dev mode — which skips a multi-minute Next.js production build
      # that buys nothing for a test run.
      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@16/bin/pg_isready -q && break
            sleep 2
          done
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s spliit || true
          createdb -O spliit spliit || true

      - name: Check out the Spliit server
        uses: actions/checkout@v5
        with:
          repository: spliit-app/spliit
          # Pinned so a change upstream cannot turn this repo's CI red. The nightly
          # upstream-drift job is what tracks the moving target.
          ref: c3d8d3e50593d5a7c49f71ea82ebaac5c1b4fc74
          path: .spliit-server

      - name: Start Spliit
        working-directory: .spliit-server
        env:
          POSTGRES_PRISMA_URL: postgresql://spliit@localhost:5432/spliit
          POSTGRES_URL_NON_POOLING: postgresql://spliit@localhost:5432/spliit
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npx prisma migrate deploy
          nohup npx next dev -p 3009 > "$RUNNER_TEMP/spliit.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3009/api/health/readiness >/dev/null && exit 0
            sleep 5
          done
          echo "Spliit never became ready:"; tail -50 "$RUNNER_TEMP/spliit.log"; exit 1

      - name: Verify the API client against the real server
        run: make test-live

      # Runs the suites in parallel across simulator clones. Two workers, not more: the runner
      # has few cores, and every worker also adds load to the single Spliit server they share.
      - name: Run UI tests
        run: |
          make generate
          xcodebuild test \
            -project Spliit.xcodeproj -scheme Spliit \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 2 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/e2e.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: build/e2e.xcresult
          retention-days: 7

  # Catches what recorded fixtures cannot: the Spliit API changing shape.
  #
  # This runs against a *fresh* pull of the published image rather than against spliit.app,
  # for two reasons — the live suite writes data, which has no business landing in production,
  # and testing the newest image catches a breaking change before it is deployed rather than
  # after.
  upstream-drift:
    name: Upstream API drift
    if: github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@16/bin/pg_isready -q && break
            sleep 2
          done
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s spliit || true
          createdb -O spliit spliit || true

      # Unpinned on purpose: this job exists to notice upstream changes.
      - name: Check out the Spliit server at main
        uses: actions/checkout@v5
        with:
          repository: spliit-app/spliit
          ref: main
          path: .spliit-server

      - name: Start Spliit
        working-directory: .spliit-server
        env:
          POSTGRES_PRISMA_URL: postgresql://spliit@localhost:5432/spliit
          POSTGRES_URL_NON_POOLING: postgresql://spliit@localhost:5432/spliit
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npx prisma migrate deploy
          nohup npx next dev -p 3009 > "$RUNNER_TEMP/spliit.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3009/api/health/readiness >/dev/null && exit 0
            sleep 5
          done
          echo "Spliit never became ready:"; tail -50 "$RUNNER_TEMP/spliit.log"; exit 1

      - name: Round-trip every procedure the app uses
        run: make test-live

      - name: Re-record fixtures and report any drift
        run: |
          make fixtures
          if ! git diff --quiet -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures; then
            echo "::warning::Recorded API fixtures differ from the current server."
            git diff --stat -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures
          fi

