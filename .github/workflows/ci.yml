name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly, to catch the API changing shape under us.
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the decoders, the storage migration and the money maths, on the host.
  # No simulator, no server — this should stay under a minute.
  unit:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      # Runner images move Xcode around and rename it between releases, so pick the newest
      # one that is actually installed rather than hardcoding a path.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        working-directory: Packages/SpliitKit
        run: swift test

  build:
    name: Build app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # `make build` passes CODE_SIGNING_ALLOWED=NO, so CI needs no signing credentials.
      - name: Build for simulator
        run: make build

      # Reads the `.stringsdata` the build just wrote, so it goes here rather than in a job of
      # its own that would pay for a second build. `make strings` is the same check locally.
      - name: Check string catalogues
        run: python3 Scripts/check-strings.py build

  # The real thing: the app driving a real Spliit instance in the simulator.
  #
  # Only on pull requests that are ready for review. It takes 10-20 minutes, which is too slow
  # to pay on every push to a branch still being worked on. Because every change reaches main
  # through a PR, main is still covered — by the run that gated the merge.
  e2e:
    name: End-to-end tests
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pinned so a change upstream cannot turn this repo's CI red, and so the built server is
      # byte-identical from run to run and therefore cacheable. The nightly upstream-drift job
      # is what tracks the moving target.
      SPLIIT_SERVER_REF: c3d8d3e50593d5a7c49f71ea82ebaac5c1b4fc74
      MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
      MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # GitHub's macOS runners are themselves VMs and cannot nest virtualization, so Colima has
      # no way to start a Docker daemon. The server therefore runs natively: Postgres from
      # Homebrew, and a production Next.js build restored from cache.
      #
      # Production rather than `next dev` on purpose. Dev mode compiles each route on its first
      # request, which shows up as multi-second stalls partway through a UI run and gets worse
      # with parallel workers hammering one server. Caching the build means paying for it once
      # per server pin instead of once per run.
      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@16/bin/pg_isready -q && break
            sleep 2
          done
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s spliit || true
          createdb -O spliit spliit || true

      # Object storage for the expense-documents suites. Spliit never handles the file itself:
      # it signs a PUT against a bucket and the client uploads straight to it, so without a
      # bucket here the app would only ever be exercised on the path where an instance answers
      # that it stores nothing.
      #
      # The address, the credentials and the anonymous read policy all match
      # `e2e/compose.yaml`, so one set of `S3_UPLOAD_*` settings describes the harness whether
      # it is running under Docker locally or as loose binaries here. Pinned and cached for the
      # reason the server build is: a moving download is a red build nobody changed anything to
      # earn.
      - name: Restore MinIO
        uses: actions/cache@v4
        with:
          path: ~/.minio-bin
          key: minio-${{ runner.os }}-${{ env.MINIO_VERSION }}-${{ env.MC_VERSION }}

      - name: Start object storage
        run: |
          mkdir -p ~/.minio-bin
          [ -x ~/.minio-bin/minio ] || curl -sSLo ~/.minio-bin/minio \
            "https://dl.min.io/server/minio/release/darwin-arm64/archive/minio.$MINIO_VERSION"
          [ -x ~/.minio-bin/mc ] || curl -sSLo ~/.minio-bin/mc \
            "https://dl.min.io/client/mc/release/darwin-arm64/archive/mc.$MC_VERSION"
          chmod +x ~/.minio-bin/minio ~/.minio-bin/mc
          mkdir -p "$RUNNER_TEMP/minio/spliit"
          MINIO_ROOT_USER=spliit MINIO_ROOT_PASSWORD=spliitspliit \
            nohup ~/.minio-bin/minio server "$RUNNER_TEMP/minio" --address :9009 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9009/minio/health/live >/dev/null && break
            sleep 1
          done
          ~/.minio-bin/mc alias set e2e http://localhost:9009 spliit spliitspliit
          ~/.minio-bin/mc anonymous set download e2e/spliit

      - name: Check out the Spliit server
        uses: actions/checkout@v5
        with:
          repository: spliit-app/spliit
          ref: ${{ env.SPLIIT_SERVER_REF }}
          path: .spliit-server

      - name: Restore the built server
        id: server-cache
        uses: actions/cache@v4
        with:
          path: |
            .spliit-server/node_modules
            .spliit-server/.next
          key: spliit-server-${{ runner.os }}-${{ env.SPLIIT_SERVER_REF }}-${{ hashFiles('.spliit-server/package-lock.json') }}

      # Only on a miss, so this is paid once per server pin rather than once per run.
      # `--ignore-scripts` skips the postinstall, which wants a database it does not need yet;
      # `build.env` is the repo's own file of mocked values for a build with no real secrets.
      - name: Build the server
        if: steps.server-cache.outputs.cache-hit != 'true'
        working-directory: .spliit-server
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          cp scripts/build.env .env
          npm run build
          # Real environment variables win over a .env file, but leaving one holding a
          # nonexistent database host around is asking for a confusing failure later.
          rm .env

      - name: Start Spliit
        working-directory: .spliit-server
        env:
          POSTGRES_PRISMA_URL: postgresql://spliit@localhost:5432/spliit
          POSTGRES_URL_NON_POOLING: postgresql://spliit@localhost:5432/spliit
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ENABLE_EXPENSE_DOCUMENTS: 'true'
          S3_UPLOAD_KEY: spliit
          S3_UPLOAD_SECRET: spliitspliit
          S3_UPLOAD_BUCKET: spliit
          S3_UPLOAD_REGION: us-east-1
          S3_UPLOAD_ENDPOINT: http://localhost:9009
        run: |
          npx prisma migrate deploy
          nohup npx next start -p 3009 > "$RUNNER_TEMP/spliit.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3009/api/health/readiness >/dev/null && exit 0
            sleep 2
          done
          echo "Spliit never became ready:"; tail -50 "$RUNNER_TEMP/spliit.log"; exit 1

      - name: Verify the API client against the real server
        run: make test-live

      # Deliberately serial. Two workers measured *slower* than one on this runner — 17+
      # minutes against a 14-minute serial baseline — because the clones contend for a few
      # cores and then queue behind one shared server anyway. The suites are split so
      # parallelism is available (`make e2e WORKERS=n` locally), but it only pays once the
      # server has stopped being the bottleneck. Re-measure before turning it on here.
      - name: Run UI tests
        run: |
          make generate
          xcodebuild test \
            -project Spliit.xcodeproj -scheme Spliit \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:SpliitUITests/ScreenshotTests \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 180 \
            -resultBundlePath build/e2e.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: build/e2e.xcresult
          retention-days: 7

  # Catches what recorded fixtures cannot: the Spliit API changing shape.
  #
  # Runs against a fresh checkout of the server's main branch rather than against spliit.app,
  # for two reasons — the live suite writes data, which has no business landing in production,
  # and testing the newest code catches a breaking change before it is deployed rather than
  # after.
  #
  # Stays on `next dev`, unlike the end-to-end job: there is nothing to cache against a moving
  # branch, and this job only round-trips each procedure once, so per-route compilation costs
  # seconds rather than minutes.
  upstream-drift:
    name: Upstream API drift
    if: github.event_name == 'schedule'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MINIO_VERSION: RELEASE.2025-09-07T16-13-09Z
      MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Start Postgres
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          for i in $(seq 1 30); do
            /opt/homebrew/opt/postgresql@16/bin/pg_isready -q && break
            sleep 2
          done
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s spliit || true
          createdb -O spliit spliit || true

      # Object storage for the expense-documents suites. Spliit never handles the file itself:
      # it signs a PUT against a bucket and the client uploads straight to it, so without a
      # bucket here the app would only ever be exercised on the path where an instance answers
      # that it stores nothing.
      #
      # The address, the credentials and the anonymous read policy all match
      # `e2e/compose.yaml`, so one set of `S3_UPLOAD_*` settings describes the harness whether
      # it is running under Docker locally or as loose binaries here. Pinned and cached for the
      # reason the server build is: a moving download is a red build nobody changed anything to
      # earn.
      - name: Restore MinIO
        uses: actions/cache@v4
        with:
          path: ~/.minio-bin
          key: minio-${{ runner.os }}-${{ env.MINIO_VERSION }}-${{ env.MC_VERSION }}

      - name: Start object storage
        run: |
          mkdir -p ~/.minio-bin
          [ -x ~/.minio-bin/minio ] || curl -sSLo ~/.minio-bin/minio \
            "https://dl.min.io/server/minio/release/darwin-arm64/archive/minio.$MINIO_VERSION"
          [ -x ~/.minio-bin/mc ] || curl -sSLo ~/.minio-bin/mc \
            "https://dl.min.io/client/mc/release/darwin-arm64/archive/mc.$MC_VERSION"
          chmod +x ~/.minio-bin/minio ~/.minio-bin/mc
          mkdir -p "$RUNNER_TEMP/minio/spliit"
          MINIO_ROOT_USER=spliit MINIO_ROOT_PASSWORD=spliitspliit \
            nohup ~/.minio-bin/minio server "$RUNNER_TEMP/minio" --address :9009 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9009/minio/health/live >/dev/null && break
            sleep 1
          done
          ~/.minio-bin/mc alias set e2e http://localhost:9009 spliit spliitspliit
          ~/.minio-bin/mc anonymous set download e2e/spliit

      # Unpinned on purpose: this job exists to notice upstream changes.
      - name: Check out the Spliit server at main
        uses: actions/checkout@v5
        with:
          repository: spliit-app/spliit
          ref: main
          path: .spliit-server

      - name: Start Spliit
        working-directory: .spliit-server
        env:
          POSTGRES_PRISMA_URL: postgresql://spliit@localhost:5432/spliit
          POSTGRES_URL_NON_POOLING: postgresql://spliit@localhost:5432/spliit
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_ENABLE_EXPENSE_DOCUMENTS: 'true'
          S3_UPLOAD_KEY: spliit
          S3_UPLOAD_SECRET: spliitspliit
          S3_UPLOAD_BUCKET: spliit
          S3_UPLOAD_REGION: us-east-1
          S3_UPLOAD_ENDPOINT: http://localhost:9009
        run: |
          npm ci
          npx prisma migrate deploy
          nohup npx next dev -p 3009 > "$RUNNER_TEMP/spliit.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3009/api/health/readiness >/dev/null && exit 0
            sleep 5
          done
          echo "Spliit never became ready:"; tail -50 "$RUNNER_TEMP/spliit.log"; exit 1

      - name: Round-trip every procedure the app uses
        run: make test-live

      - name: Re-record fixtures and report any drift
        run: |
          make fixtures
          if ! git diff --quiet -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures; then
            echo "::warning::Recorded API fixtures differ from the current server."
            git diff --stat -- Packages/SpliitKit/Tests/SpliitAPITests/Fixtures
          fi

