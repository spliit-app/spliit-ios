# The Xcode project is generated from this file — never edit Spliit.xcodeproj by hand, and
# never commit it. Run `make generate` after adding a target, a build setting or a resource.
# Adding source files needs nothing: the whole Spliit/ folder is picked up.

name: Spliit

options:
  bundleIdPrefix: app.spliit
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  SpliitKit:
    path: Packages/SpliitKit

settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    # Xcode turns this on for you when you add a string catalog through the UI, which is a
    # thing that never happens here. Without it the compiler emits no .stringsdata, nothing
    # knows which strings the source actually contains, and the catalogue quietly stops
    # growing — it had 21 of 166 keys before anyone noticed. `make strings` reads what this
    # emits.
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Spliit:
    type: application
    platform: iOS
    sources:
      - path: Spliit
      - path: Shared
    dependencies:
      - package: SpliitKit
        product: SpliitAPI
      - package: SpliitKit
        product: SpliitCore
    settings:
      base:
        # The App Store record this replaces. Changing it would ship a second, separate app
        # and strand every existing user's local data.
        PRODUCT_BUNDLE_IDENTIFIER: app.spliit.spliitmobile
        PRODUCT_NAME: Spliit
        MARKETING_VERSION: 2.1.0
        # Must exceed every build App Store Connect has already seen, which is not the same
        # as exceeding what shipped: 21 was uploaded once and refused for declaring no
        # orientations, so it is spent whether or not it ever appeared. The store shows
        # 1.2.0 (20) — and note that the ../spliit-mobile checkout says 1.1.0, so the source
        # of truth is App Store Connect, not that repo.
        CURRENT_PROJECT_VERSION: 23
        # Orientations are declared under `info:` below, not here. INFOPLIST_KEY_* settings are
        # only merged when Xcode generates the Info.plist itself; this project writes its own,
        # so anything set that way is silently dropped — which is how the app reached App Store
        # Connect declaring no orientations at all, and was rejected for it (error 90474).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Swift 6.2: UI code is main-actor by default, so views and stores need no annotation
        # and the concurrency that remains is the concurrency that is actually deliberate.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VKY5EKKU47
        # Associated Domains, for Universal Links. Needs the capability enabled on the App ID:
        # `make build-device` passes -allowProvisioningUpdates and will add it, but a signed
        # build fails until it exists. Simulator builds and CI are unaffected — they build
        # with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_ENTITLEMENTS: Spliit/Spliit.entitlements
    info:
      path: Spliit/Info.plist
      properties:
        CFBundleDisplayName: Spliit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Photographing a receipt to fill in an expense, and reading the QR code that lets
        # someone into a group. The photo library needs no counterpart: PhotosPicker runs out of
        # process and hands back only what was chosen. Translated in
        # `Spliit/Resources/InfoPlist.xcstrings` — `make strings` reads what the compiler
        # extracts and cannot see this one, so its French goes in by hand.
        NSCameraUsageDescription: Spliit reads receipts you photograph and the QR codes you scan to join a group, on your iPhone.
        UIUserInterfaceStyle: Automatic
        # The app builds universal (UIDeviceFamily 1,2) and iPad layouts are a non-goal rather
        # than unsupported, so it has to satisfy the iPad multitasking rule: an iPad-capable app
        # that doesn't set UIRequiresFullScreen must accept all four orientations. Upside-down
        # stays off the iPhone list, where it was deliberately excluded — and where iOS ignores
        # it on any Face ID device regardless.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without this the app is letterboxed into a legacy screen size. An empty dictionary
        # asks for the standard generated launch screen.
        UILaunchScreen: {}
        # Carried over from the React Native app so existing deep links keep working.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app.spliit.spliitmobile
        # Self-hosted instances on a home network, and the end-to-end harness on localhost,
        # are reachable over plain HTTP. Everything else still requires TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true

  SpliitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpliitUITests
      - path: Shared
    dependencies:
      - target: Spliit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.spliit.spliitmobile.uitests
        TEST_TARGET_NAME: Spliit
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VKY5EKKU47

schemes:
  Spliit:
    build:
      targets:
        Spliit: all
        SpliitUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpliitUITests
      environmentVariables:
        # Where the UI tests expect the throwaway instance from `make e2e-up` to be.
        SPLIIT_E2E_BASE_URL: http://localhost:3009/
